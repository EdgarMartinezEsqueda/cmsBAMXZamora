# Rutas de Strapi dentro del sitio público (bamxzamora.org / www).
# Destino en el VPS: /etc/nginx/snippets/bamx-site-locations.conf
#
# NO es un server block: se incluye DENTRO del server block HTTPS que ya sirve el sitio:
#
#     server {
#         listen 443 ssl;
#         server_name bamxzamora.org www.bamxzamora.org;
#         root __RUTA_REPO__/dist;
#         ...
#         include snippets/bamx-security-headers.conf;
#         include snippets/bamx-site-locations.conf;
#
#         # Fallback de la SPA: necesario para /nosotros, /boletines/..., páginas /:slug.
#         location / {
#             try_files $uri $uri/ /index.html;
#         }
#     }
#
# Reemplaza __RUTA_REPO__ por la ruta real del repositorio en el VPS (la de secrets.ROUTE).
#
# Coloca el include ANTES de cualquier otra `location ~* ...` del server block (p. ej. una regla
# de caché para \.(png|jpg|js|css)$): Nginx usa la primera location con regex que coincide, y
# una regla genérica de imágenes se quedaría con /uploads/*.png sin el alias correcto.

# --- API pública de contenido (solo lectura) --------------------------------------------
location ^~ /api/content/ {
    proxy_pass http://127.0.0.1:1337;
    include snippets/bamx-proxy.conf;
}

# --- Formulario de contacto -----------------------------------------------------------
location = /api/contact {
    limit_req zone=bamx_contact burst=5 nodelay;
    client_max_body_size 20k;
    proxy_pass http://127.0.0.1:1337;
    include snippets/bamx-proxy.conf;
}

# --- Mapa del sitio para buscadores (lo genera Strapi con lo publicado) -------------------
location = /sitemap.xml {
    proxy_pass http://127.0.0.1:1337/api/sitemap.xml;
    include snippets/bamx-proxy.conf;
}

# --- Todo lo demás de /api no se publica (p. ej. /api/auth/*, /api/users, /api/upload) ---
location ^~ /api/ {
    return 404;
}

# --- Archivos subidos desde el panel (imágenes y PDF) -----------------------------------
# Solo se sirven los tipos que Strapi acepta (config/plugins.js). Cualquier otra ruta bajo
# /uploads responde 404, sin listados de carpeta.
location ~* ^/uploads/([A-Za-z0-9._-]+\.(?:webp|png|jpe?g|pdf))$ {
    alias __RUTA_REPO__/cms/public/uploads/$1;
    autoindex off;
    include snippets/bamx-security-headers.conf;
    add_header Cache-Control "public, max-age=2592000" always;
}

location /uploads/ {
    return 404;
}
