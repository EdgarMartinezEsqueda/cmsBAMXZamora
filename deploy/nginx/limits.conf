# Zonas de límite de peticiones para BAMX Zamora.
# Destino en el VPS: /etc/nginx/conf.d/bamx-limits.conf  (Nginx lo carga dentro de http {}).
#
# $binary_remote_addr es la IP real del visitante (Nginx es el primer salto; no hay CDN delante).

# Login del panel y recuperación de contraseña: 5 intentos por minuto por IP.
limit_req_zone $binary_remote_addr zone=bamx_login:10m rate=5r/m;

# Formulario de contacto: 10 envíos por minuto por IP (Strapi además limita 5 cada 10 min).
limit_req_zone $binary_remote_addr zone=bamx_contact:10m rate=10r/m;

# Responder 429 (Too Many Requests) en vez del 503 por defecto.
limit_req_status 429;
