# Cabeceras de seguridad del sitio público.
# Destino en el VPS: /etc/nginx/snippets/bamx-security-headers.conf
#
# Ojo con add_header en Nginx: si una location define su propio add_header, deja de heredar
# los del server. Por eso este archivo se incluye en el server Y en cada location que agregue
# cabeceras (p. ej. /uploads).
#
# La Content-Security-Policy solo limita quién puede incrustar el sitio (frame-ancestors). No restringe scripts: el sitio usa Elfsight (Instagram), Cloudflare Turnstile,
# Google Maps, YouTube y Google Drive; una CSP estricta debe afinarse aparte.

# Sin includeSubDomains: obligaría a HTTPS en todos los subdominios del dominio (p. ej. los de
# la otra plataforma del VPS). Agrégalo solo si todos tienen certificado.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# El sitio solo puede incrustarse en sí mismo y en el panel (botón "Vista previa" de Strapi).
# Sustituye a X-Frame-Options, que no permite nombrar un segundo origen.
add_header Content-Security-Policy "frame-ancestors 'self' https://cms.bamxzamora.org" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
