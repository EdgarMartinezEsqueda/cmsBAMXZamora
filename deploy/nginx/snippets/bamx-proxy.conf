# Cabeceras de proxy hacia Strapi (127.0.0.1:1337).
# Destino en el VPS: /etc/nginx/snippets/bamx-proxy.conf
#
# IMPORTANTE: X-Forwarded-For se SOBRESCRIBE con la IP real ($remote_addr), no se agrega
# ($proxy_add_x_forwarded_for). Strapi confía en esta cabecera (TRUST_NGINX_PROXY=true con
# maxIpsCount: 1); si se agregara, un visitante podría falsear su IP y saltarse los límites
# del formulario de contacto.

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header Connection "";

proxy_connect_timeout 10s;
proxy_read_timeout 60s;
proxy_send_timeout 60s;
