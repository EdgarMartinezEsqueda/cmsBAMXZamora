# Panel de Strapi: cms.bamxzamora.org
# Destino en el VPS: /etc/nginx/sites-available/cms.bamxzamora.org  (+ enlace en sites-enabled)
#
# Se instala en HTTP (puerto 80) y después `certbot --nginx -d cms.bamxzamora.org` le agrega el
# certificado, el `listen 443 ssl` y la redirección de HTTP a HTTPS. No agregues las líneas SSL
# a mano. Requiere antes el registro DNS A de cms.bamxzamora.org apuntando al VPS.
#
# El panel vive en su propio subdominio porque su API interna usa rutas en la raíz
# (/admin, /content-manager, /upload, /i18n, /users-permissions, ...) que chocarían con las
# rutas del sitio y con las páginas creadas desde el panel (/:slug).

server {
    listen 80;
    listen [::]:80;
    server_name cms.bamxzamora.org;

    # Log propio: lo lee fail2ban para bloquear IPs con muchos logins fallidos.
    access_log /var/log/nginx/cms.bamxzamora.org.access.log;
    error_log  /var/log/nginx/cms.bamxzamora.org.error.log;

    # Subidas desde el panel: Strapi acepta hasta 15 MB por archivo.
    client_max_body_size 16m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # La raíz del subdominio lleva al panel.
    location = / {
        return 302 /gestion-bamx;
    }

    # Login, recuperación de contraseña y registro del primer admin: 5 por minuto por IP
    # (ráfaga de 3). Los intentos fallidos además los cuenta fail2ban.
    location ~ ^/admin/(login|forgot-password|reset-password|register-admin)$ {
        limit_req zone=bamx_login burst=3 nodelay;
        proxy_pass http://127.0.0.1:1337;
        include snippets/bamx-proxy.conf;
    }

    # La API pública de contenido se sirve solo por el dominio del sitio; aquí no.
    location ^~ /api/ {
        return 404;
    }

    # Panel (/gestion-bamx) y su API interna.
    location / {
        proxy_pass http://127.0.0.1:1337;
        include snippets/bamx-proxy.conf;
    }
}
