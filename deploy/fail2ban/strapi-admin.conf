# Filtro de fail2ban: logins fallidos del panel de Strapi.
# Destino en el VPS: /etc/fail2ban/filter.d/strapi-admin.conf
#
# Lee el log de acceso de Nginx del subdominio del panel (formato "combined"). Strapi responde
# 400/401 a credenciales inválidas; Nginx responde 429 cuando se pasa el límite de intentos.
#
# Probar el filtro contra el log real:
#   fail2ban-regex /var/log/nginx/cms.bamxzamora.org.access.log /etc/fail2ban/filter.d/strapi-admin.conf

[Definition]
failregex = ^<HOST> - \S+ \[[^\]]+\] "POST /admin/(?:login|forgot-password|reset-password) HTTP/[0-9.]+" (?:400|401|429)
ignoreregex =
