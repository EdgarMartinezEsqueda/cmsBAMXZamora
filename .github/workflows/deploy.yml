name: Deploy to VPS

# Solo manual por ahora: este sitio necesita Strapi desplegado en el VPS. Cuando termine el
# despliegue (deploy/README.md, paso C10), este archivo se reemplaza por deploy/github/deploy.yml,
# que vuelve a desplegar en cada push a master.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Deploy to VPS
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        port: 22
        script: |
          echo "=== Iniciando deployment ==="
          
          # Cargar NVM y Node.js
          export NVM_DIR="/root/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          [ -s "$NVM_DIR/bash_completion" ] && \. "$NVM_DIR/bash_completion"
          
          # Usar la versión específica de Node
          nvm use v22.19.0
          
          echo "=== Verificando herramientas ==="
          node --version
          corepack enable
          pnpm --version
          pm2 --version
          
          # Navegar al directorio del proyecto
          cd ${{ secrets.ROUTE }}
          
          echo "=== Directorio actual: $(pwd) ==="
          
          # Hacer git pull
          echo "=== Ejecutando git pull ==="
          git pull
          
          # Instalar/actualizar dependencias
          echo "=== Instalando dependencias ==="
          pnpm install --frozen-lockfile
          
          # Hacer el build
          echo "=== Ejecutando build ==="
          pnpm run build
          
          # Reiniciar nginx
          sudo systemctl restart nginx
          
          echo "=== Deployment completado ==="