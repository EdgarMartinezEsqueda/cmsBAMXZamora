# Propuesta de workflow para cuando exista Strapi en el VPS.
# Reemplaza a .github/workflows/deploy.yml DESPUÉS del primer despliegue manual y de cambiar el secret
# ROUTE a la carpeta nueva (PLAN.md del repo privado de despliegue, Paso 19).
#
# Orden: primero Strapi y su verificación; el sitio solo se recompila si Strapi responde. Si
# Strapi no arranca, el job falla y el sitio anterior sigue en línea.

name: Deploy to VPS

on:
  push:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Deploy to VPS
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        port: 22
        command_timeout: 20m
        script: |
          set -euo pipefail
          echo "=== Iniciando deployment ==="

          cd ${{ secrets.ROUTE }}
          echo "=== Directorio: $(pwd) ==="

          echo "=== git pull ==="
          git pull --ff-only

          # --- Strapi (usuario bamxcms, Node 22 del sistema) -------------------------------
          echo "=== Strapi: dependencias y panel ==="
          chown -R bamxcms:bamxcms cms shared
          # pnpm por Corepack (README.md del repo de despliegue, B3b); --frozen-lockfile = instalar exactamente el lock.
          sudo -u bamxcms -H bash -c 'cd cms && pnpm install --frozen-lockfile && NODE_ENV=production pnpm run build'

          echo "=== Strapi: reinicio ==="
          systemctl restart bamx-cms

          echo "=== Strapi: verificación (hasta 90 s) ==="
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:1337/api/content/site; then ok=1; break; fi
            sleep 3
          done
          if [ "$ok" != "1" ]; then
            echo "Strapi no responde: NO se recompila el sitio. Log:"
            journalctl -u bamx-cms -n 80 --no-pager
            exit 1
          fi

          # --- Sitio (Node 22 del sistema, el mismo que usa Strapi) ---------------------------
          echo "=== Sitio: dependencias y build ==="
          pnpm install --frozen-lockfile
          pnpm run build

          echo "=== Nginx: validar y recargar ==="
          nginx -t
          systemctl reload nginx

          echo "=== Deployment completado ==="
