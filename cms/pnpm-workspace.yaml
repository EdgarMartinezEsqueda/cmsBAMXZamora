allowBuilds:
  '@swc/core': true
  core-js-pure: true
  esbuild: true
# @swc/core 1.16.3+ se niega a cargar si la carpeta de caché (AppData\Local\swc) hereda permisos de
# una cuenta de Windows huérfana, como pasa en este equipo. 1.16.2 es la versión que ya funcionaba.
overrides:
  '@swc/core': 1.16.2
